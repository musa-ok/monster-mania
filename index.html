<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Monster Mania</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Lilita+One&display=swap">
<style>
/* Layout: full-bleed 3D archipelago; candy HUD floats over it; panels rise from the bottom like a phone game. Single bright world by choice. */
:root{
  --ink:#2a2350; --ink-soft:#615a8f; --panel:#f7f8ff; --panel-2:#eceffd; --line:#d6dcf5; --white:#ffffff;
  --go:#3fc25c; --go-d:#249040; --gold:#ffc53d; --gold-d:#d48f12; --gem:#ff4f9a; --gem-d:#c22a6c;
  --blue:#4a8dff; --blue-d:#2f62c9; --danger:#ff5d5d; --danger-d:#c43434; --food:#ff6a4d;
  --sky1:#6fcbff; --sky2:#d9f3ff; --hud:rgba(36,28,78,.8); --hud-line:rgba(255,255,255,.2);
  --f-display:'Lilita One','Baloo 2',system-ui,sans-serif; --f-body:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  color-scheme: light;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:linear-gradient(var(--sky1),var(--sky2) 60%);color:var(--ink);font-family:var(--f-body);font-size:15px;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
body.battle-bg{background:linear-gradient(#ff9a6b,#ffe0a8 65%)}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
button{font-family:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
svg{display:block}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#hud > *{pointer-events:auto}
.hud-top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:8px}
.lvl{position:relative;width:50px;height:50px;flex:none;border:0;background:none;padding:0;cursor:pointer}
.lvl svg{position:absolute;inset:0}
.lvl span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:19px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.pills{display:flex;gap:6px;flex:1;min-width:0;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:5px;background:var(--hud);border:2px solid var(--hud-line);color:#fff;border-radius:999px;padding:3px 10px 3px 4px;font-family:var(--f-display);font-size:15px;letter-spacing:.02em;min-width:0;font-variant-numeric:tabular-nums}
.pill svg{width:22px;height:22px;flex:none}
button.pill{cursor:pointer}
.pill .plus{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--go);font-size:14px;line-height:1;margin-left:2px}
.round{width:42px;height:42px;flex:none;border-radius:50%;border:2px solid var(--hud-line);background:var(--hud);display:grid;place-items:center;cursor:pointer;color:#fff}
.round svg{width:22px;height:22px}
.hud-bottom{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;gap:10px}
.nav{position:relative;width:72px;height:70px;border-radius:20px;border:0;border-bottom:5px solid #c9cfee;background:var(--white);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;box-shadow:0 6px 18px rgba(30,40,90,.22);font-family:var(--f-display);font-size:13px;color:var(--ink);letter-spacing:.02em}
.nav svg{width:32px;height:32px}
.nav:active{transform:translateY(2px);border-bottom-width:3px}
.badge{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;border-radius:11px;background:var(--danger);color:#fff;font-size:13px;display:grid;place-items:center;padding:0 5px;border:2px solid #fff}
#placeBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 100px);z-index:6;background:var(--hud);color:#fff;border-radius:16px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:12px;font-weight:700;max-width:calc(100% - 32px)}

/* world labels */
#labels{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.bub{position:absolute;left:0;top:0;display:flex;align-items:center;gap:4px;white-space:nowrap;font-family:var(--f-display);font-size:14px;letter-spacing:.02em;border-radius:999px;padding:3px 10px 3px 4px;background:var(--white);color:var(--ink);box-shadow:0 4px 10px rgba(30,40,90,.25);will-change:transform}
.bub svg{width:22px;height:22px}
.bub.tap{pointer-events:auto;cursor:pointer;animation:bob 1.6s ease-in-out infinite}
.bub.full{background:var(--gold);color:#5a3a00}
.bub.timer{background:var(--hud);color:#fff;font-size:12px;padding:2px 9px 2px 3px}
.bub.timer svg{width:16px;height:16px}
.bub.name{background:rgba(255,255,255,.88);font-size:12px;padding:2px 10px;pointer-events:auto;cursor:pointer;color:var(--ink-soft)}
.bub.lock{background:var(--hud);color:#fff;pointer-events:auto;cursor:pointer;padding:5px 12px 5px 6px}
.bub.plot{width:52px;height:52px;padding:0;justify-content:center;border-radius:50%;background:var(--go);color:#fff;font-size:30px;pointer-events:auto;cursor:pointer;border:3px solid #fff;animation:pulse 1.1s ease-in-out infinite}
@keyframes bob{50%{margin-top:-5px}}
@keyframes pulse{50%{scale:1.12}}

/* toasts + flying icons */
#toasts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 70px);left:50%;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:calc(100% - 32px)}
.toast{background:var(--hud);color:#fff;padding:8px 16px;border-radius:14px;font-weight:700;text-align:center;animation:tin .25s ease-out;max-width:100%}
.toast.good{background:#2a9b48}
.toast.bad{background:#c43434}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
.fly{position:fixed;left:0;top:0;width:26px;height:26px;z-index:40;pointer-events:none}
.float{position:fixed;left:0;top:0;z-index:35;pointer-events:none;font-family:var(--f-display);font-size:22px;color:#fff;-webkit-text-stroke:1px rgba(42,35,80,.6);text-shadow:0 2px 0 rgba(42,35,80,.5);white-space:nowrap}

/* sheet */
#sheetWrap{position:fixed;inset:0;z-index:20}
.backdrop{position:absolute;inset:0;background:rgba(30,24,70,.35)}
.sheet{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(580px,100%);max-height:80%;display:flex;flex-direction:column;background:var(--panel);border-radius:26px 26px 0 0;box-shadow:0 -10px 40px rgba(30,24,70,.3);animation:sup .26s cubic-bezier(.2,.9,.3,1.1)}
@keyframes sup{from{transform:translate(-50%,40px);opacity:.4}}
.sheet header{display:flex;align-items:center;gap:10px;padding:16px max(16px,env(safe-area-inset-right,0px)) 10px max(18px,env(safe-area-inset-left,0px))}
.sheet h2{flex:1;margin:0;font-family:var(--f-display);font-weight:400;font-size:24px;letter-spacing:.01em;text-wrap:balance}
.x{width:38px;height:38px;border-radius:50%;border:0;background:var(--panel-2);font-size:24px;line-height:1;cursor:pointer;color:var(--ink)}
.sheet-body{overflow:auto;padding:4px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.lab{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft)}
.muted{color:var(--ink-soft);font-size:14px;line-height:1.45}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.grow{flex:1;min-width:0}
.tabs{display:flex;gap:6px;background:var(--panel-2);padding:4px;border-radius:14px}
.tabs button{flex:1;border:0;background:none;border-radius:10px;padding:8px 4px;font-family:var(--f-display);font-size:14px;cursor:pointer;color:var(--ink-soft)}
.tabs button.on{background:var(--white);color:var(--ink);box-shadow:0 2px 6px rgba(30,40,90,.12)}

.btn{font-family:var(--f-display);font-size:16px;letter-spacing:.02em;color:#fff;background:var(--go);border:0;border-bottom:4px solid var(--go-d);border-radius:14px;padding:10px 16px 8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-shadow:0 1px 0 rgba(0,0,0,.18);white-space:nowrap}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn svg{width:20px;height:20px}
.btn.gold{background:var(--gold);border-color:var(--gold-d);color:#5a3a00;text-shadow:none}
.btn.gem{background:var(--gem);border-color:var(--gem-d)}
.btn.blue{background:var(--blue);border-color:var(--blue-d)}
.btn.ghost{background:var(--panel-2);border-color:var(--line);color:var(--ink);text-shadow:none}
.btn.danger{background:var(--danger);border-color:var(--danger-d)}
.btn.wide{width:100%}
.btn.sm{font-size:14px;padding:7px 12px 5px;border-radius:12px}
.btn[disabled]{filter:grayscale(.85);opacity:.5;cursor:not-allowed}

.card{background:var(--white);border:2px solid var(--line);border-radius:18px;padding:12px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.mcard{position:relative;background:var(--white);border:2px solid var(--line);border-radius:16px;padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;min-width:0}
.mcard img{width:76px;height:76px}
.mcard .nm{font-weight:800;font-size:13px;line-height:1.1;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcard .lv{font-size:12px;color:var(--ink-soft);font-weight:700}
.mcard .els{position:absolute;top:5px;left:5px;display:flex;gap:2px}
.mcard .els svg{width:16px;height:16px}
.mcard.sel{border-color:var(--go);box-shadow:0 0 0 3px rgba(63,194,92,.3)}
.mcard.sel::after{content:attr(data-n);position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:var(--go);color:#fff;font-family:var(--f-display);display:grid;place-items:center;font-size:13px}
.mcard.empty{border-style:dashed;justify-content:center;min-height:118px;color:var(--ink-soft);font-weight:700;font-size:13px;background:transparent}
.mcard.empty b{font-size:30px;line-height:1}
.mcard.lockd img{filter:brightness(0) opacity(.28)}
.mcard .tag{font-size:11px;font-weight:700;color:var(--ink-soft);text-align:center;line-height:1.2}
.chip{display:inline-flex;align-items:center;gap:3px;border-radius:999px;padding:1px 9px 1px 3px;font-weight:800;font-size:13px;background:color-mix(in srgb,var(--ec) 16%,var(--white));color:color-mix(in srgb,var(--ec) 70%,var(--ink));border:1.5px solid color-mix(in srgb,var(--ec) 40%,var(--white))}
.chip svg{width:16px;height:16px}
.bar{height:12px;border-radius:6px;background:var(--panel-2);overflow:hidden;border:1.5px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(var(--gold),#f5a623);border-radius:6px}
.bar.xp i{background:linear-gradient(#7cc3ff,var(--blue))}
.bar.hp i{background:linear-gradient(#7be08f,var(--go));transition:width .35s}
.bar.hp.low i{background:linear-gradient(#ff9a7a,var(--danger))}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel-2);border-radius:12px;padding:6px 8px;text-align:center}
.stat b{display:block;font-family:var(--f-display);font-weight:400;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink-soft);font-weight:700}
.hero{display:flex;gap:14px;align-items:center}
.hero img{width:132px;height:132px;flex:none;background:radial-gradient(circle at 50% 60%,var(--white),var(--panel-2) 70%);border-radius:24px}
.evo{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.evo div{text-align:center;font-size:11px;font-weight:800;color:var(--ink-soft);padding:5px 2px;border-radius:10px;background:var(--panel-2);line-height:1.15}
.evo div.on{background:var(--go);color:#fff}
.evo div small{display:block;font-weight:600;opacity:.85}
.item{display:flex;gap:12px;align-items:center;background:var(--white);border:2px solid var(--line);border-radius:18px;padding:10px 12px}
.item .ic{width:56px;height:56px;flex:none;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--ec,#8a8fb0) 18%,var(--white))}
.item .ic svg{width:34px;height:34px}
.item .ic img{width:56px;height:56px}
.item h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:17px;letter-spacing:.01em}
.item p{margin:0;font-size:13px;color:var(--ink-soft);line-height:1.35}
.item.lk{opacity:.6}
.goal{display:flex;gap:10px;align-items:center;background:var(--white);border:2px solid var(--line);border-radius:16px;padding:10px 12px}
.goal.done{border-color:var(--go)}
.outs{display:flex;flex-wrap:wrap;gap:8px}
.out{display:flex;flex-direction:column;align-items:center;width:70px;font-size:11px;font-weight:700;text-align:center;line-height:1.15}
.out img{width:56px;height:56px}
.out.lockd img{filter:brightness(0) opacity(.28)}
.slots{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.heart{width:36px;height:36px;color:var(--gem)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper b{flex:1;text-align:center;font-family:var(--f-display);font-weight:400;font-size:20px}

/* modal */
#modalWrap{position:fixed;inset:0;z-index:25;background:rgba(30,24,70,.45);display:grid;place-items:center;padding:16px}
.modal{width:min(380px,100%);background:var(--panel);border-radius:28px;padding:22px 20px 18px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;box-shadow:0 20px 60px rgba(20,10,60,.4);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.modal h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:28px;text-wrap:balance}
.modal .kick{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gem)}
.modal img{width:180px;height:180px;background:radial-gradient(circle at 50% 60%,#fff,#fde3f0 75%);border-radius:50%}
.modal p{margin:0;color:var(--ink-soft);line-height:1.45}
.modal ol{margin:0;padding-left:22px;text-align:left;color:var(--ink-soft);line-height:1.5;display:flex;flex-direction:column;gap:4px}
.modal .row{justify-content:center}
.rewards{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.rewards span{display:flex;align-items:center;gap:4px;background:var(--white);border:2px solid var(--line);border-radius:999px;padding:3px 12px 3px 4px;font-family:var(--f-display)}
.rewards svg{width:22px;height:22px}

/* battle */
#battleUI{position:fixed;inset:0;z-index:8;pointer-events:none}
#battleUI > *{pointer-events:auto}
.bc{background:rgba(255,255,255,.94);border-radius:18px;padding:8px 12px;box-shadow:0 6px 18px rgba(80,30,10,.2);display:flex;flex-direction:column;gap:4px;width:min(300px,calc(100% - 32px))}
.bc .top{display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-size:17px}
.bc .top .grow{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bc .top small{font-family:var(--f-body);font-weight:800;font-size:13px;color:var(--ink-soft)}
.bc .top svg{width:18px;height:18px}
.bc .hpt{font-size:12px;font-weight:800;color:var(--ink-soft);display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:4px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--go);border:1.5px solid #fff}
.dots i.off{background:#b9b4cf}
#bcEnemy{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(16px,env(safe-area-inset-right,0px))}
.bbottom{position:absolute;left:0;right:0;bottom:0;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;align-items:center}
.bbottom .bc{align-self:flex-start}
#bLog{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 110px);transform:translateX(-50%);background:var(--hud);color:#fff;padding:6px 14px;border-radius:12px;font-weight:700;text-align:center;width:max-content;max-width:calc(100% - 32px);pointer-events:none}
#bLog:empty{display:none}
.skills{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:min(560px,100%)}
.skill{position:relative;border:0;border-bottom:4px solid color-mix(in srgb,var(--ec) 60%,#000);background:var(--ec);color:#fff;border-radius:16px;padding:8px 10px 6px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:8px;align-items:center;text-align:left;cursor:pointer;font-family:var(--f-display);font-size:15px;text-shadow:0 1px 0 rgba(0,0,0,.25);min-width:0}
.skill svg{grid-row:span 2;width:26px;height:26px;background:rgba(255,255,255,.9);border-radius:50%;padding:3px}
.skill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.skill small{font-family:var(--f-body);font-weight:700;font-size:12px;opacity:.95}
.skill em{position:absolute;top:-9px;right:8px;font-style:normal;font-family:var(--f-body);font-weight:800;font-size:11px;padding:0 7px;border-radius:8px;background:#fff;color:var(--go-d);text-shadow:none}
.skill em.weak{color:var(--danger-d)}
.skill[disabled]{filter:grayscale(.7) brightness(.9);opacity:.6;cursor:default}
.flee{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(16px,env(safe-area-inset-left,0px))}

#loading{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:linear-gradient(var(--sky1),var(--sky2));font-family:var(--f-display);font-size:30px;color:#fff;text-shadow:0 3px 0 rgba(42,35,80,.35);text-align:center;padding:16px}
@media (max-width:420px){.nav{width:64px;height:64px;font-size:12px}.nav svg{width:28px;height:28px}.pill{font-size:14px;padding-right:8px}.pill svg{width:20px;height:20px}.hero img{width:110px;height:110px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="stage"></div>
<div id="labels"></div>
<div id="hud">
  <div class="hud-top">
    <button class="lvl" data-act="profile" aria-label="Oyuncu seviyesi">
      <svg viewBox="0 0 50 50"><circle cx="25" cy="25" r="22" fill="#5b3fd1" stroke="#fff" stroke-width="3"/><circle id="xpRing" cx="25" cy="25" r="18" fill="none" stroke="#ffd23f" stroke-width="4" stroke-linecap="round" stroke-dasharray="113" stroke-dashoffset="113" transform="rotate(-90 25 25)"/></svg>
      <span id="lvlNum">1</span>
    </button>
    <div class="pills">
      <div class="pill" id="pGold"><i data-ico="gold"></i><b id="vGold">0</b></div>
      <div class="pill" id="pFood"><i data-ico="food"></i><b id="vFood">0</b></div>
      <button class="pill" id="pGem" data-act="shop" data-tab="gems" aria-label="Elmas"><i data-ico="gem"></i><b id="vGem">0</b><span class="plus">+</span></button>
    </div>
    <button class="round" id="bSound" data-act="sound" aria-label="Ses"></button>
  </div>
  <div class="hud-bottom">
    <button class="nav" data-act="shop"><i data-ico="shop"></i>Mağaza</button>
    <button class="nav" data-act="collection"><i data-ico="mon"></i>Canavarlar</button>
    <button class="nav" data-act="arena"><i data-ico="sword"></i>Arena</button>
    <button class="nav" data-act="goals"><i data-ico="flag"></i>Görevler<span class="badge" id="goalBadge" hidden></span></button>
  </div>
</div>
<div id="placeBar" hidden><span id="placeTxt">Yerleştirmek için yeşil + işaretine dokun</span><button class="btn sm ghost" data-act="cancelPlace">İptal</button></div>
<div id="toasts"></div>
<div id="sheetWrap" hidden><div class="backdrop" data-act="closeSheet"></div><section class="sheet" role="dialog" aria-labelledby="sheetTitle"><header><h2 id="sheetTitle"></h2><button class="x" data-act="closeSheet" aria-label="Kapat">×</button></header><div class="sheet-body" id="sheetBody"></div></section></div>
<div id="modalWrap" hidden><div class="modal" id="modal" role="dialog"></div></div>
<div id="battleUI" hidden>
  <button class="btn sm ghost flee" data-act="flee">Kaç</button>
  <div class="bc" id="bcEnemy"></div>
  <div id="bLog"></div>
  <div class="bbottom"><div class="bc" id="bcMine"></div><div class="skills" id="bSkills"></div></div>
